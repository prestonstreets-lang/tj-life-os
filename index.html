<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080d1c" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Our Life OS — a shared household command center for money, missions, fitness, self mastery and growth." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Our Life OS" />
  <title>Our Life OS</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-effects="balanced">
  <div class="ambient" aria-hidden="true">
    <span class="aurora aurora-a"></span>
    <span class="aurora aurora-b"></span>
    <span class="grid-plane"></span>
    <span class="noise"></span>
  </div>

  <div id="bootSplash" class="boot-splash" aria-label="Launching Our Life OS">
    <img src="./assets/icon.svg" alt="" width="112" height="112" />
    <div class="boot-wordmark"><strong>OUR LIFE OS</strong><span>Household command center</span></div>
    <div class="boot-rail"><i></i></div>
  </div>

  <div id="app" class="app-shell" aria-live="polite">
    <noscript>Our Life OS requires JavaScript to run.</noscript>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
